[project]
name = "fsm-stackelberg"
version = "0.1.0"
description = "FSM-Stackelberg: state-machine Stackelberg diagnosis-repair for agentic NLO, validated on TSLP demand-uncertainty ECR"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "requests>=2.32.3,<3.0.0",
    "numpy>=2.2.5,<3.0.0",
    "pandas>=2.2.3,<3.0.0",
    "matplotlib>=3.10.3,<4.0.0",
    "openai>=2.26.0,<3.0.0",
    "tabulate>=0.9.0,<0.10.0",
    "gurobipy>=12.0.2,<13.0.0",
    "folia>=2.5.12,<3.0.0",
    "coord-convert>=0.2.1,<0.3.0",
    "networkx>=3.4.2,<4.0.0",
    "python-dotenv>=1.1.0,<2.0.0",
    "seaborn>=0.13.2,<0.14.0",
    "xpinyin>=0.7.7,<0.8.0",
    "pyyaml>=6.0.3,<7.0.0",
    "json5>=0.13.0,<0.14.0",
    "httpx[socks]>=0.28.1,<0.29.0",
    "langchain>=1.2.13,<2.0.0",
    "langchain-openai>=1.1.11,<2.0.0",
    "langgraph>=1.1.3,<2.0.0",
    "langchain-community>=0.4.1,<0.5.0",
    "anthropic>=0.86.0,<0.87.0",
    "langchain-anthropic>=1.4.0,<2.0.0",
    "scipy>=1.17.1,<2.0.0",
    "pulp>=3.3.2",
    "ecr-shared-data",
    "tslp-ecr-demand",
]

[dependency-groups]
dev = [
    "python-pptx>=1.0.2,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fsm_stackelberg", "src/generator"]

[tool.uv.sources]
ecr-shared-data = { path = "../ecr-shared-data", editable = true }
tslp-ecr-demand = { path = "../tslp-ecr-demand", editable = true }
